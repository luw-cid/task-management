#spring.application.name=task-management
spring:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operationsSorter: method
    disable-swagger-default-url: true
    tags-sorter: alpha
  show-actuator: false
  application:
    name: task-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.fehtqwthjxzfyvytelke}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TaskManagerHikariPool
      minimum-idle: 5
      maximum-pool-size: 8
      idle-timeout: 300000        # 5 minute
      connection-timeout: 20000   # 20s
      max-lifetime: 1200000       # 20 minute
      connection-test-query: SELECT 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true

  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/task_management}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/task_management}
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migration: true
    validate-on-migration: true

server:
  max-http-request-header-size: 8KB

app:
  jwt:
    # Khóa bí mật HS256. Đọc từ biến môi trường JWT_SECRET, nếu không có sẽ tự dùng chuỗi hex mặc định phía sau.
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    access-token-expiration: 86400000     # 1 ngày (ms)
    refresh-token-expiration: 604800000   # 7 ngày (ms)
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174,https://task-management-eta-liart.vercel.app}