name: Frontend CI

on:
  push:
    paths:
      - "taskflow-UI/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "taskflow-UI/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-UI

    steps:
        # Bước 1: Kéo code từ repo về runner
        - name: Checkout code
          uses: actions/checkout@v4

        # Bước 2: Cài đặt Node.js
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22.x'
            cache: 'npm'
            cache-dependency-path: 'taskflow-UI/package-lock.json'

        # Bước 3: Cài đặt dependencies
        - name: Install dependencies
          run: npm ci

        # Bước 4: kiểm tra build Frontend
        - name: Build Frontend
          run: npm run build
        